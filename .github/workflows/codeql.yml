name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: github/codeql-action/init@v3.32.6
      with:
        languages: javascript
        config-file: ./.github/codeql/codeql-config.yml
    - uses: github/codeql-action/analyze@v3.32.6
